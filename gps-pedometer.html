<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>걸음길 — GPS 만보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --paper: #f4f1e8;
    --paper-2: #ece7d8;
    --ink: #232a1f;
    --ink-soft: #5a6152;
    --trail: #3f6144;
    --trail-deep: #2c4630;
    --contour: #c9c0a3;
    --blaze: #b5482a;
    --blaze-deep: #8f381f;
    --line: rgba(35, 42, 31, 0.14);
    --card-bg: #fbf9f2;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #171a14;
      --paper-2: #1e2318;
      --ink: #ece7d8;
      --ink-soft: #a4a893;
      --trail: #7fa878;
      --trail-deep: #a9cba0;
      --contour: #3a4030;
      --blaze: #e17a52;
      --blaze-deep: #f4a281;
      --line: rgba(236, 231, 216, 0.14);
      --card-bg: #1e2318;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171a14;
    --paper-2: #1e2318;
    --ink: #ece7d8;
    --ink-soft: #a4a893;
    --trail: #7fa878;
    --trail-deep: #a9cba0;
    --contour: #3a4030;
    --blaze: #e17a52;
    --blaze-deep: #f4a281;
    --line: rgba(236, 231, 216, 0.14);
    --card-bg: #1e2318;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  header.top h1 {
    font-family: 'Fraunces', Georgia, 'Noto Serif KR', serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.top .date {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  /* --- hero panel --- */
  .hero {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 34px 24px 26px;
    overflow: hidden;
    text-align: center;
  }
  .hero svg.contours {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.55;
    pointer-events: none;
  }
  .hero-inner { position: relative; z-index: 1; }
  .hero .label {
    font-size: 0.72rem;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }
  .stepcount {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: clamp(3.2rem, 15vw, 4.6rem);
    line-height: 1;
    margin: 10px 0 4px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .stepcount .unit {
    font-size: 0.35em;
    font-weight: 400;
    color: var(--ink-soft);
    margin-left: 6px;
  }
  .goal-line {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .goal-line strong { color: var(--trail-deep, var(--trail)); }

  .progress-track {
    height: 6px;
    background: var(--contour);
    border-radius: 3px;
    overflow: hidden;
    margin: 0 auto;
    max-width: 320px;
  }
  .progress-fill {
    height: 100%;
    background: var(--trail);
    width: 0%;
    transition: width 0.4s ease;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    font-size: 0.72rem;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 5px 10px;
    border-radius: 999px;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink-soft);
    flex: none;
  }
  .status-pill.active .status-dot { background: var(--trail); box-shadow: 0 0 0 3px color-mix(in srgb, var(--trail) 25%, transparent); }
  .status-pill.warn .status-dot { background: var(--blaze); }

  /* --- stats row --- */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    margin-top: 18px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--card-bg);
  }
  .stat {
    padding: 16px 10px;
    text-align: center;
    border-right: 1px solid var(--line);
  }
  .stat:last-child { border-right: none; }
  .stat .v {
    font-size: 1.25rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat .k {
    font-size: 0.66rem;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  /* --- controls --- */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
  }
  button {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 14px 10px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--card-bg);
    color: var(--ink);
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  button.primary {
    background: var(--trail);
    color: #f4f1e8;
    border-color: var(--trail);
  }
  button.primary.stop {
    background: var(--blaze);
    border-color: var(--blaze);
  }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 2px solid var(--trail);
    outline-offset: 2px;
  }
  .reset-row { margin-top: 10px; }
  .reset-row button { width: 100%; background: transparent; color: var(--ink-soft); }

  /* --- settings --- */
  details.settings {
    margin-top: 22px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  details.settings summary {
    cursor: pointer;
    font-size: 0.78rem;
    color: var(--ink-soft);
    list-style: none;
  }
  details.settings summary::-webkit-details-marker { display: none; }
  details.settings summary::before {
    content: "▸ ";
  }
  details.settings[open] summary::before { content: "▾ "; }

  .field-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
  }
  .field-row label {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  .field-row input {
    width: 90px;
    font-family: inherit;
    font-size: 0.85rem;
    padding: 8px 10px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    text-align: right;
  }

  .note {
    margin-top: 18px;
    font-size: 0.72rem;
    line-height: 1.6;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>걸음길</h1>
    <span class="date" id="today"></span>
  </header>

  <div class="hero">
    <svg class="contours" viewBox="0 0 400 220" preserveAspectRatio="none">
      <path d="M-10 40 C 80 10, 150 70, 250 30 S 420 20, 430 50" fill="none" stroke="var(--contour)" stroke-width="1"/>
      <path d="M-10 70 C 90 40, 160 100, 260 60 S 410 55, 430 85" fill="none" stroke="var(--contour)" stroke-width="1"/>
      <path d="M-10 100 C 100 70, 170 130, 270 95 S 400 90, 430 120" fill="none" stroke="var(--contour)" stroke-width="1"/>
      <path d="M-10 180 C 80 150, 160 205, 260 170 S 400 165, 430 195" fill="none" stroke="var(--contour)" stroke-width="1"/>
      <path d="M-10 205 C 90 180, 170 225, 270 195 S 410 190, 430 215" fill="none" stroke="var(--contour)" stroke-width="1"/>
    </svg>
    <div class="hero-inner">
      <div class="label">오늘 걸음 수</div>
      <div class="stepcount"><span id="steps">0</span><span class="unit">걸음</span></div>
      <div class="goal-line">목표 <strong id="goalLabel">10,000</strong>걸음 중 <span id="goalPct">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusText">GPS 대기 중</span></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="v" id="distance">0.00</div>
      <div class="k">거리 (km)</div>
    </div>
    <div class="stat">
      <div class="v" id="pace">–</div>
      <div class="k">페이스 (분/km)</div>
    </div>
    <div class="stat">
      <div class="v" id="calories">0</div>
      <div class="k">칼로리 (kcal)</div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="toggleBtn">시작</button>
    <button id="settingsToggleBtn">설정</button>
  </div>
  <div class="reset-row">
    <button id="resetBtn">오늘 기록 초기화</button>
  </div>

  <details class="settings" id="settingsPanel">
    <summary>측정 설정</summary>
    <div class="field-row">
      <label for="strideInput">보폭 (cm)</label>
      <input type="number" id="strideInput" min="30" max="120" step="1" value="70">
    </div>
    <div class="field-row">
      <label for="weightInput">체중 (kg)</label>
      <input type="number" id="weightInput" min="20" max="200" step="1" value="65">
    </div>
    <div class="field-row">
      <label for="goalInput">목표 걸음 수</label>
      <input type="number" id="goalInput" min="1000" max="50000" step="500" value="10000">
    </div>
  </details>

  <p class="note">
    걸음 수는 GPS로 측정된 이동 거리를 보폭으로 나눠 추정한 값이라 실제 걸음 수와 차이가 있을 수 있어요.
    실외에서, 하늘이 트인 곳일수록 정확도가 올라가요. 기록은 이 기기의 브라우저에만 저장되고 자정이 지나면 새로 시작돼요.
  </p>

</div>

<script>
(function () {
  var els = {
    steps: document.getElementById('steps'),
    distance: document.getElementById('distance'),
    pace: document.getElementById('pace'),
    calories: document.getElementById('calories'),
    goalLabel: document.getElementById('goalLabel'),
    goalPct: document.getElementById('goalPct'),
    progressFill: document.getElementById('progressFill'),
    statusPill: document.getElementById('statusPill'),
    statusText: document.getElementById('statusText'),
    toggleBtn: document.getElementById('toggleBtn'),
    resetBtn: document.getElementById('resetBtn'),
    settingsToggleBtn: document.getElementById('settingsToggleBtn'),
    settingsPanel: document.getElementById('settingsPanel'),
    strideInput: document.getElementById('strideInput'),
    weightInput: document.getElementById('weightInput'),
    goalInput: document.getElementById('goalInput'),
    today: document.getElementById('today')
  };

  var STORAGE_KEY = 'gps-pedometer-state-v1';
  var todayStr = new Date().toISOString().slice(0, 10);

  els.today.textContent = new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });

  var state = {
    date: todayStr,
    distanceMeters: 0,
    activeSeconds: 0,
    stride: 70,
    weight: 65,
    goal: 10000
  };

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (saved && saved.date === todayStr) {
        state.distanceMeters = saved.distanceMeters || 0;
        state.activeSeconds = saved.activeSeconds || 0;
      }
      if (saved) {
        if (saved.stride) state.stride = saved.stride;
        if (saved.weight) state.weight = saved.weight;
        if (saved.goal) state.goal = saved.goal;
      }
    } catch (e) {
      console.warn('저장된 기록을 불러오지 못했어요.', e);
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn('기록을 저장하지 못했어요.', e);
    }
  }

  loadState();
  els.strideInput.value = state.stride;
  els.weightInput.value = state.weight;
  els.goalInput.value = state.goal;

  var watchId = null;
  var lastPos = null;
  var tracking = false;
  var timerId = null;

  function haversineMeters(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var toRad = function (d) { return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1);
    var dLon = toRad(lon2 - lon1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function fmtNumber(n) {
    return Math.round(n).toLocaleString('ko-KR');
  }

  function render() {
    var strideM = state.stride / 100;
    var steps = strideM > 0 ? state.distanceMeters / strideM : 0;
    var distKm = state.distanceMeters / 1000;
    var calories = distKm * state.weight * 0.5;
    var paceMinPerKm = distKm > 0.02 ? (state.activeSeconds / 60) / distKm : null;

    els.steps.textContent = fmtNumber(steps);
    els.distance.textContent = distKm.toFixed(2);
    els.calories.textContent = fmtNumber(calories);
    els.pace.textContent = paceMinPerKm && isFinite(paceMinPerKm) ? paceMinPerKm.toFixed(1) : '–';

    var pct = Math.min(100, (steps / state.goal) * 100);
    els.progressFill.style.width = pct + '%';
    els.goalLabel.textContent = fmtNumber(state.goal);
    els.goalPct.textContent = Math.round(pct) + '%';
  }

  function setStatus(text, mode) {
    els.statusText.textContent = text;
    els.statusPill.classList.remove('active', 'warn');
    if (mode) els.statusPill.classList.add(mode);
  }

  function onPosition(pos) {
    var coords = pos.coords;
    var now = pos.timestamp;

    if (coords.accuracy && coords.accuracy > 40) {
      setStatus('GPS 정확도 낮음 (±' + Math.round(coords.accuracy) + 'm)', 'warn');
    } else {
      setStatus('추적 중 · ±' + Math.round(coords.accuracy || 0) + 'm', 'active');
    }

    if (lastPos) {
      var dt = (now - lastPos.timestamp) / 1000;
      if (dt > 0) {
        var d = haversineMeters(lastPos.lat, lastPos.lon, coords.latitude, coords.longitude);
        var speed = d / dt;
        var accOk = !coords.accuracy || coords.accuracy < 40;
        var noiseFloor = Math.max(2, (coords.accuracy || 5) * 0.4);

        if (accOk && speed < 3.2 && d > noiseFloor) {
          state.distanceMeters += d;
          state.activeSeconds += dt;
          saveState();
        } else if (accOk && speed >= 0 && d <= noiseFloor) {
          state.activeSeconds += dt;
        }
      }
    }

    lastPos = { lat: coords.latitude, lon: coords.longitude, timestamp: now };
    render();
  }

  function onError(err) {
    var msg = '위치 정보를 가져올 수 없어요.';
    if (err.code === err.PERMISSION_DENIED) msg = '위치 권한이 필요해요. 브라우저 설정에서 허용해 주세요.';
    else if (err.code === err.TIMEOUT) msg = 'GPS 응답이 늦어요. 하늘이 트인 곳으로 이동해 보세요.';
    setStatus(msg, 'warn');
  }

  function startTracking() {
    if (!('geolocation' in navigator)) {
      setStatus('이 브라우저는 위치 정보를 지원하지 않아요.', 'warn');
      return;
    }
    tracking = true;
    lastPos = null;
    els.toggleBtn.textContent = '일시정지';
    els.toggleBtn.classList.add('stop');
    setStatus('위치 확인 중…');

    watchId = navigator.geolocation.watchPosition(onPosition, onError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 15000
    });

    timerId = setInterval(saveState, 10000);
  }

  function stopTracking() {
    tracking = false;
    els.toggleBtn.textContent = '시작';
    els.toggleBtn.classList.remove('stop');
    setStatus('일시정지됨');
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    if (timerId) { clearInterval(timerId); timerId = null; }
    saveState();
  }

  els.toggleBtn.addEventListener('click', function () {
    if (tracking) stopTracking(); else startTracking();
  });

  els.resetBtn.addEventListener('click', function () {
    if (tracking) stopTracking();
    state.distanceMeters = 0;
    state.activeSeconds = 0;
    saveState();
    render();
    setStatus('초기화됨');
  });

  els.settingsToggleBtn.addEventListener('click', function () {
    els.settingsPanel.open = !els.settingsPanel.open;
  });

  els.strideInput.addEventListener('change', function () {
    var v = parseFloat(els.strideInput.value);
    if (v > 0) { state.stride = v; saveState(); render(); }
  });
  els.weightInput.addEventListener('change', function () {
    var v = parseFloat(els.weightInput.value);
    if (v > 0) { state.weight = v; saveState(); render(); }
  });
  els.goalInput.addEventListener('change', function () {
    var v = parseFloat(els.goalInput.value);
    if (v > 0) { state.goal = v; saveState(); render(); }
  });

  render();
})();
</script>
</body>
</html>
